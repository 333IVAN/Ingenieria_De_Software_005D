spring.application.name=service-inventario
server.port=8087

spring.datasource.url=jdbc:mysql://localhost:3306/db_inventario?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Configuración de Swagger (OpenAPI) ---
springdoc.api-docs.path=/inventarios/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.openapi.servers[0].url=http://localhost:9090
springdoc.openapi.servers[0].description=Servidor a través del Gateway

