server:
  port: 9090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
          corsConfigurations:
            '[/**]':
              allowedOrigins:
                - "http://127.0.0.1:5500"
                - "http://localhost:5500"
              allowedMethods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              allowedHeaders:
                - "*"
              Access-Control-Allow-Origin: http://127.0.0.1:5500
      routes:
        - id: service-usuario
          uri: http://localhost:8082
          predicates:
            - Path=/usuarios/**, /usuariorol/**, /roles/**

        - id: service-direccion
          uri: http://localhost:8083
          predicates:
            - Path=/comunas/**, /direcciones/**

        - id: service-donacion
          uri: http://localhost:8084
          predicates:
            - Path=/donaciones/**, /insumos/**

        - id: service-mascota
          uri: http://localhost:8085
          predicates:
            - Path=/mascotas/**

        - id: service-eventos
          uri: http://localhost:8086
          predicates:
            - Path=/campanias/**